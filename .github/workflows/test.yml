name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests
        run: uv run pytest tests/ -v
        working-directory: app
        env:
          DATABASE_URL: "sqlite:///./transitar.db"
          PASSWORD_HASH_ALGORITHM: sha256
          JWT_SECRET_KEY: ci-test-secret
          JWT_ALGORITHM: HS256
          JWT_ISSUER: transitar-api
          JWT_AUDIENCE: transitar-client
